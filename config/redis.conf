# ============================================================================
# redis.conf
# Config opinativa pra produção: persistência AOF+RDB, segurança reforçada,
# logging razoável. Valores que dependem do ambiente (senha, maxmemory,
# maxmemory-policy) são passados via --flag no command do docker-compose.
# ============================================================================

# ---------------------------------------------------------------------------
# Rede
# ---------------------------------------------------------------------------
bind 0.0.0.0 -::*
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------------------------------------------------------------------------
# Persistência
# ---------------------------------------------------------------------------
# RDB: snapshots em disco. Formato: save <seconds> <changes>.
# Default do Redis 7+: save se 1 mudança em 1h, 100 em 5min, 10000 em 1min.
save 3600 1
save 300 100
save 60 10000

# Para salvar se houve mudanças mesmo em erro (trava o write, evita corrupção)
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF: append-only log. Garante durabilidade quase instantânea.
# Combinado com RDB, você tem RDB (snapshots rápidos pra restore) + AOF
# (pouquíssima perda em caso de crash).
appendonly yes
appendfilename "appendonly.aof"
# everysec: fsync 1x por segundo. Perde no máximo 1s em crash. Balance ideal.
# always: fsync a cada write (lento). no: deixa o OS decidir (arriscado).
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# ---------------------------------------------------------------------------
# Limites e conexões
# ---------------------------------------------------------------------------
# maxclients: quantos clientes podem conectar
maxclients 10000

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
loglevel notice
logfile ""
databases 16

# ---------------------------------------------------------------------------
# Slow log (queries lentas, análogo ao log_min_duration_statement do PG)
# ---------------------------------------------------------------------------
# Threshold em microssegundos. 10ms = 10000μs.
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------------------------------------------------------------------------
# Latency monitor
# ---------------------------------------------------------------------------
latency-monitor-threshold 100

# ---------------------------------------------------------------------------
# Segurança — comandos perigosos renomeados/desabilitados
# ---------------------------------------------------------------------------
# FLUSHDB/FLUSHALL apagam dados em massa. DEBUG permite crashar o server.
# Renomear pra "" desabilita. Mantenha CONFIG e SHUTDOWN se você usa, mas
# considera renomear pra um nome aleatório em produção.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
# Descomente pra desabilitar também CONFIG (você NÃO vai conseguir usar
# CONFIG SET depois — precisa restart pra mudar config):
# rename-command CONFIG ""

# ---------------------------------------------------------------------------
# Threading (Redis 6+)
# ---------------------------------------------------------------------------
# I/O threading acelera parsing de comandos em workloads com network pressure.
# Regra: usar nº de CPU cores - 1, até no máximo 8.
io-threads 4
io-threads-do-reads yes

# ---------------------------------------------------------------------------
# Lazy freeing — remove keys grandes em background sem bloquear
# ---------------------------------------------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes
replica-lazy-flush yes
